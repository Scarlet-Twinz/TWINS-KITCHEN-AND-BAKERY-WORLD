<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFM2.5-VL Open-World Proof</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:32px auto;padding:0 20px}
button,input{font:inherit}button{padding:10px 16px;margin:8px 0;cursor:pointer}
#status{padding:12px;background:#f4f4f4;border-radius:8px;white-space:pre-wrap}
.card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}
img{max-width:320px;max-height:260px;display:block;margin:10px 0;border-radius:8px}
.result{white-space:pre-wrap;background:#fafafa;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>LFM2.5-VL — Open-World Proof</h1>
<p>This is an isolated proof. It does not read the catalogue, assign Product IDs, write the database, or modify Media Center.</p>
<input id="files" type="file" accept="image/*" multiple>
<button id="run" disabled>Analyze selected images</button>
<div id="status">Loading model…</div>
<div id="results"></div>
<script type="module" src="./proof.js"></script>
</body>
</html>
