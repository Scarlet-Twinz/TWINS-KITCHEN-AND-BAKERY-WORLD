<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Access | Twins Kitchen</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../../styles.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <section class="panel" style="width:min(460px,100%)">
    <div style="margin-bottom:24px">
      <span class="eyebrow">TWINS ADMINISTRATION</span>
      <h1 style="margin:.4rem 0">OWNER ACCESS</h1>
      <p>Sign in with the existing Owner account to access the private Media Center.</p>
    </div>
    <form id="ownerLogin" novalidate>
      <label style="display:block;margin-bottom:16px">
        Email
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label style="display:block;margin-bottom:16px">
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="message" role="alert" aria-live="polite" style="display:none;margin-bottom:16px"></div>
      <button id="submit" class="btn red" type="submit">Sign in</button>
    </form>
  </section>
</main>
<script src="./login.js"></script>
</body>
</html>
