name: Node Tests

on:
  push:
  pull_request:

jobs:
  media-ingestion-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full Node test suite
        run: node --test "tools/media-ingestion/test/*.test.js"

  media-center-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Media Center syntax checks
        run: python -m py_compile backend/main.py backend/media_center.py backend/create_owner.py

      - name: Run Media Center unit tests
        working-directory: backend
        run: python -m unittest discover -p "test_*.py"

      - name: Check Media Center browser JavaScript
        run: node --check admin/media/media-center.js
