name: Node Tests

on:
  push:
  pull_request:

jobs:
  media-ingestion-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full Node test suite
        run: node --test tools/media-ingestion/test/*.test.js
