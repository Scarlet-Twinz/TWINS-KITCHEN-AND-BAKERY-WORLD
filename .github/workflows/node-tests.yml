name: Node Tests

on:
  push:
  pull_request:

jobs:
  media-ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full Node test suite
        run: node --test tools/media-ingestion/test/*.test.js
      - name: Check public storefront JavaScript
        run: node --check app.js && node --check marketplace.js && node --check marketplace-admin.js
      - name: Run Phase 1 reference audit
        run: node tools/media-ingestion/index.js reference-audit

  media-center-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Media Center syntax checks
        run: python -m py_compile backend/main.py backend/media_center.py backend/create_owner.py backend/migrate.py backend/marketplace_api.py backend/marketplace_ops_api.py
      - name: Run Media Center unit tests
        working-directory: backend
        run: python -m unittest discover -p "test_*.py"
      - name: Run repository backend tests from repo root
        run: python -m unittest discover -s backend -p "test_*.py"
      - name: Check Media Center browser JavaScript
        run: node --check admin/media/media-center.js
      - name: Check Media Center vision matcher JavaScript
        run: node --check admin/media/media-visual-matcher.js
      - name: Check local SmolVLM adapter and service JavaScript
        run: node --check admin/media/smolvlm-local.js && node --check tools/smolvlm-local/server.js
