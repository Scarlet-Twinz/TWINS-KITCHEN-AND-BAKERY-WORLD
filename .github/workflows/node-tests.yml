name: Repository Tests

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check storefront JavaScript
        run: |
          node --check data.js
          node --check app.js
          node --check admin.js
          node --check operations.js
          node --check phase3.js
          node --check commerce-ux.js
          node --check marketplace.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/create_admin.py
          python backend/test_operations.py
