services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: twins_kitchen
      POSTGRES_USER: twins
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - twins_postgres:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twins -d twins_kitchen"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://twins:change-this-local-password@postgres:5432/twins_kitchen
      SESSION_SECRET: replace-with-a-long-random-secret
      FRONTEND_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      COOKIE_SECURE: "false"
      PORT: "8000"
      MEDIA_STORAGE_ROOT: /app/storage/media-intake
    ports:
      - "8000:8000"
    volumes:
      - twins_media_intake:/app/storage/media-intake
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  twins_postgres:
  twins_media_intake:
