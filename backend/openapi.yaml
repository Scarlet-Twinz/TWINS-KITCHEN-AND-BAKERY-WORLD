openapi: 3.0.3
info:
  title: Twins Kitchen & Bakery World API
  version: 0.2.0
  description: Production API contract for the static storefront migration.
servers:
  - url: https://api.example.com
paths:
  /api/catalogue:
    get:
      summary: List active catalogue products
      responses:
        '200':
          description: Product collection
  /api/auth/signup:
    post:
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '201': { description: Account created }
        '409': { description: Account already exists }
  /api/auth/login:
    post:
      summary: Authenticate a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '200': { description: Authenticated session }
        '401': { description: Invalid credentials }
  /api/quotes:
    post:
      summary: Create a quote request
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
      responses:
        '201': { description: Quote created }
        '400': { description: Invalid request }
  /api/account/me:
    get:
      summary: Get the current authenticated account
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Account }
        '401': { description: Authentication required }
  /api/quotes/me:
    get:
      summary: List the current user's quote requests
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Quote collection }
  /api/admin/quotes:
    get:
      summary: List recent quote requests for staff
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Quote collection }
        '403': { description: Staff access required }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: twins_session
  schemas:
    AuthPayload:
      type: object
      required: [email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    Quote:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        business: { type: string }
        stage: { type: string }
        packageName: { type: string }
        location: { type: string }
        capacity: { type: string }
        space: { type: string }
        utilities: { type: string }
        requirements: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, quantity]
            properties:
              id: { type: integer }
              quantity: { type: integer, minimum: 1 }
